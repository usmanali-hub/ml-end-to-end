[project]
name = "ml-end-to-end"
version = "0.1.0"
description = "End-to-end machine learning on telecom customer churn: data card, honest baselines, tests"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "scikit-learn>=1.8", "numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.8", "ruff>=0.5", "pandas-stubs", "nbconvert", "ipykernel", "nbformat"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.mypy]
strict = true
files = ["src"]
ignore_missing_imports = true
