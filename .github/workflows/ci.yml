name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Restore cached analyses (only reused when the source, data and library versions are identical)
        uses: actions/cache@v4
        with:
          path: .cache
          key: analyses-${{ runner.os }}-${{ hashFiles('src/**/*.py', 'data/raw/telco_churn.csv', 'pyproject.toml') }}
      - run: ruff check .
      - run: mypy
      - run: pytest
      - name: Data is valid
        run: python -m mlproject check
      - name: Execute the EDA notebook
        run: jupyter nbconvert --to notebook --execute --output-dir "$RUNNER_TEMP/nb" notebooks/01_eda.ipynb
